name: DevSecOps Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - "app/**"
      - "k8s/**"
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Check Python
        run: |
          which python3
          python3 --version

      - name: SAST - Semgrep
        run: |
          python3 -m pip install --user semgrep
          python3 -m semgrep scan --config auto || true

      - name: Build Docker image
        run: docker build -t vulnerable-app:latest .

      - name: SCA - Trivy Image Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.50.1 image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            vulnerable-app:latest

      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/

      - name: ZAP DAST (Puerto 19999)
        run: |
          for p in 3000 8080 9090 9191 9292 5000; do
            lsof -ti :$p | xargs kill -9 || true
          done
          lsof -i :19999 || echo "19999 Free port"

      - name: Port-forward to pod
        run: kubectl port-forward svc/vulnerable-app 9090:80 &

      - name: Prepare ZAP report directory
        run: |
          mkdir -p /tmp/zap_reports
          chmod 777 /tmp/zap_reports
          kubectl port-forward svc/vulnerable-app 9090:80 &
          sleep 15

      - name: DAST - ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v /tmp/zap_reports:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:9090 \
              -r /zap/wrk/report.html \
              --autooff

      - name: Show ZAP report
        run: |
          cat /tmp/zap_reports/report.html
